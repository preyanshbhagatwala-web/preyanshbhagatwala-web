<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 200" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="metricBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080D" />
      <stop offset="100%" stop-color="#0C101A" />
    </linearGradient>

    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141824" stroke-width="0.5" stroke-opacity="0.5" />
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }
      .live-pulse { animation: pulseDot 2s infinite ease-in-out; }
    </style>
  </defs>

  <rect width="980" height="200" rx="8" fill="url(#metricBg)" stroke="#1E293B" stroke-width="1.2" />
  <rect width="980" height="200" rx="8" fill="url(#cardGrid)" />

  <!-- Header -->
  <g transform="translate(30, 26)">
    <circle cx="0" cy="0" r="3" fill="#38BDF8" class="live-pulse" />
    <text x="12" y="3.5" class="mono" font-size="10" fill="#38BDF8" font-weight="700" letter-spacing="1.5">TELEMETRY // PRODUCTION STACK &amp; CAPABILITIES</text>
    <text x="800" y="3.5" class="mono" font-size="9" fill="#64748B" letter-spacing="1">STATUS: OPERATIONAL</text>
  </g>

  <line x1="30" y1="40" x2="950" y2="40" stroke="#1E293B" stroke-width="0.8" />

  <!-- 4 Telemetry Metric Blocks -->
  <!-- Block 1: Flagship Platforms -->
  <g transform="translate(45, 60)">
    <rect width="205" height="116" rx="6" fill="#0A0E17" stroke="#1E293B" stroke-width="0.8" />
    <line x1="0" y1="0" x2="205" y2="0" stroke="#38BDF8" stroke-width="2" />
    <text x="16" y="24" class="mono" font-size="9" fill="#64748B" letter-spacing="1">ARCHITECTURES</text>
    <text x="16" y="54" class="sans" font-size="28" font-weight="800" fill="#F8FAFC">03</text>
    <text x="58" y="44" class="mono" font-size="10" fill="#38BDF8">CORE PLATFORMS</text>
    <text x="16" y="80" class="mono" font-size="9.5" fill="#94A3B8">• Trinetra V2 (Risk)</text>
    <text x="16" y="96" class="mono" font-size="9.5" fill="#94A3B8">• Crop ML Predictor</text>
    <text x="16" y="110" class="mono" font-size="9.5" fill="#94A3B8">• VCMS (Contract RBAC)</text>
  </g>

  <!-- Block 2: Backend & Enterprise -->
  <g transform="translate(275, 60)">
    <rect width="205" height="116" rx="6" fill="#0A0E17" stroke="#1E293B" stroke-width="0.8" />
    <line x1="0" y1="0" x2="205" y2="0" stroke="#F59E0B" stroke-width="2" />
    <text x="16" y="24" class="mono" font-size="9" fill="#64748B" letter-spacing="1">ENTERPRISE SYSTEMS</text>
    <text x="16" y="54" class="sans" font-size="28" font-weight="800" fill="#F8FAFC">JAVA</text>
    <text x="96" y="44" class="mono" font-size="10" fill="#F59E0B">&amp; NODE.JS</text>
    <text x="16" y="80" class="mono" font-size="9.5" fill="#94A3B8">• Java OOP &amp; APIs</text>
    <text x="16" y="96" class="mono" font-size="9.5" fill="#94A3B8">• Express &amp; Flask</text>
    <text x="16" y="110" class="mono" font-size="9.5" fill="#94A3B8">• PostgreSQL Relational</text>
  </g>

  <!-- Block 3: Modern Client & UX -->
  <g transform="translate(505, 60)">
    <rect width="205" height="116" rx="6" fill="#0A0E17" stroke="#1E293B" stroke-width="0.8" />
    <line x1="0" y1="0" x2="205" y2="0" stroke="#818CF8" stroke-width="2" />
    <text x="16" y="24" class="mono" font-size="9" fill="#64748B" letter-spacing="1">CLIENT ENGINEERING</text>
    <text x="16" y="54" class="sans" font-size="28" font-weight="800" fill="#F8FAFC">REACT</text>
    <text x="110" y="44" class="mono" font-size="10" fill="#818CF8">18 &amp; VITE</text>
    <text x="16" y="80" class="mono" font-size="9.5" fill="#94A3B8">• TypeScript Strict</text>
    <text x="16" y="96" class="mono" font-size="9.5" fill="#94A3B8">• Tailwind CSS</text>
    <text x="16" y="110" class="mono" font-size="9.5" fill="#94A3B8">• Interactive Visuals</text>
  </g>

  <!-- Block 4: Machine Learning & Intelligence -->
  <g transform="translate(735, 60)">
    <rect width="205" height="116" rx="6" fill="#0A0E17" stroke="#1E293B" stroke-width="0.8" />
    <line x1="0" y1="0" x2="205" y2="0" stroke="#34D399" stroke-width="2" />
    <text x="16" y="24" class="mono" font-size="9" fill="#64748B" letter-spacing="1">INTELLIGENCE &amp; DATA</text>
    <text x="16" y="54" class="sans" font-size="28" font-weight="800" fill="#F8FAFC">ML</text>
    <text x="65" y="44" class="mono" font-size="10" fill="#34D399">PIPELINES</text>
    <text x="16" y="80" class="mono" font-size="9.5" fill="#94A3B8">• Scikit-Learn Regression</text>
    <text x="16" y="96" class="mono" font-size="9.5" fill="#94A3B8">• 28,000+ Records Analyzed</text>
    <text x="16" y="110" class="mono" font-size="9.5" fill="#94A3B8">• Feature Engineering</text>
  </g>
</svg>