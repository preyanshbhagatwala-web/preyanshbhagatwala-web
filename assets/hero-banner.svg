<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cyberSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="60%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050B1A" />
    </linearGradient>

    <!-- Horizon Glowing Aura -->
    <radialGradient id="horizonGlow" cx="50%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35" />
      <stop offset="35%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Giant Name Metallic Gradient -->
    <linearGradient id="heroTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E0F2FE" />
      <stop offset="70%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Neon Cyan Border Gradient -->
    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#EC4899" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Keyframe Animations -->
    <style>
      @keyframes neonPulse {
        0%, 100% { filter: drop-shadow(0 0 18px rgba(0,240,255,0.6)) drop-shadow(0 0 35px rgba(99,102,241,0.4)); }
        50% { filter: drop-shadow(0 0 28px rgba(0,240,255,0.9)) drop-shadow(0 0 55px rgba(168,85,247,0.6)); }
      }
      @keyframes scanHorizon {
        0% { transform: translateY(0); opacity: 0.8; }
        50% { transform: translateY(-4px); opacity: 1; }
        100% { transform: translateY(0); opacity: 0.8; }
      }
      @keyframes blinkBeacon {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(1.3); }
      }
      .glowing-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', 'Montserrat', sans-serif;
        font-weight: 900;
        letter-spacing: 6px;
        animation: neonPulse 4s infinite ease-in-out;
      }
      .beacon-dot {
        animation: blinkBeacon 2s infinite ease-in-out;
        transform-origin: center;
      }
      .mono-label {
        font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      }
    </style>

    <!-- Cyber Grid with Perspective Effect -->
    <pattern id="gridOverlay" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="320" rx="14" fill="url(#cyberSky)" stroke="url(#neonBorder)" stroke-width="1.6" />
  
  <!-- Ambient Horizon Glow -->
  <rect width="1000" height="320" rx="14" fill="url(#horizonGlow)" />
  <rect width="1000" height="320" rx="14" fill="url(#gridOverlay)" />

  <!-- Digital Perspective Horizon Rays -->
  <g opacity="0.35" stroke="#00F0FF" stroke-width="0.8">
    <line x1="500" y1="180" x2="-100" y2="340" />
    <line x1="500" y1="180" x2="100" y2="340" />
    <line x1="500" y1="180" x2="300" y2="340" />
    <line x1="500" y1="180" x2="500" y2="340" stroke-width="1.2" stroke="#38BDF8" />
    <line x1="500" y1="180" x2="700" y2="340" />
    <line x1="500" y1="180" x2="900" y2="340" />
    <line x1="500" y1="180" x2="1100" y2="340" />
    <!-- Horizontal Perspective Rings -->
    <line x1="100" y1="220" x2="900" y2="220" stroke-opacity="0.4" />
    <line x1="50" y1="255" x2="950" y2="255" stroke-opacity="0.6" />
    <line x1="0" y1="295" x2="1000" y2="295" stroke-opacity="0.8" />
  </g>

  <!-- Glowing Cyber Corner Brackets -->
  <path d="M 28 16 L 16 16 L 16 28" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <path d="M 972 16 L 984 16 L 984 28" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round" />
  <path d="M 28 304 L 16 304 L 16 292" fill="none" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <path d="M 972 304 L 984 304 L 984 292" fill="none" stroke="#EC4899" stroke-width="3" stroke-linecap="round" />

  <!-- Top Telemetry Row -->
  <g transform="translate(36, 36)">
    <circle cx="0" cy="0" r="3" fill="#00F0FF" />
    <text x="12" y="4" class="mono-label" font-size="11" fill="#00F0FF" font-weight="700" letter-spacing="2">PREYANSH.DEV // V5.0</text>
    <text x="230" y="4" class="mono-label" font-size="10.5" fill="#94A3B8" letter-spacing="1.5">FULL-STACK &amp; AI ARCHITECT</text>
  </g>

  <!-- Live Status Badge on Top Right -->
  <g transform="translate(760, 24)">
    <rect width="200" height="26" rx="13" fill="#061226" stroke="#10B981" stroke-width="1.2" />
    <circle cx="15" cy="13" r="4.5" fill="#10B981" class="beacon-dot" />
    <text x="28" y="17" class="mono-label" font-weight="700" font-size="10" fill="#34D399" letter-spacing="1">SYSTEM OPERATIONAL</text>
  </g>

  <!-- Hero Main Name (Giant & Catchy) -->
  <g transform="translate(500, 126)" text-anchor="middle">
    <text font-size="52" fill="url(#heroTextGrad)" class="glowing-name">
      PREYANSH BHAGATWALA
    </text>
  </g>

  <!-- Hero Subtitle Ribbon (The User's 3 Titles) -->
  <g transform="translate(500, 172)" text-anchor="middle">
    <rect x="-380" y="-17" width="760" height="34" rx="17" fill="#070E22" fill-opacity="0.9" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.2" />
    <text y="6" class="mono-label" font-weight="700" font-size="13" letter-spacing="2.8">
      <tspan fill="#38BDF8">SOFTWARE ENGINEER</tspan>
      <tspan fill="#64748B">  ⚡  </tspan>
      <tspan fill="#F8FAFC">FULL STACK DEVELOPER</tspan>
      <tspan fill="#64748B">  ⚡  </tspan>
      <tspan fill="#EC4899">AI/ML ENTHUSIAST</tspan>
    </text>
  </g>

  <!-- High-Impact Tech Stack Badges (Including Java prominently!) -->
  <g transform="translate(500, 240)" text-anchor="middle">
    <!-- Java -->
    <g transform="translate(-320, 0)">
      <rect x="-55" y="-16" width="110" height="32" rx="8" fill="#0C1429" stroke="#F59E0B" stroke-width="1.4" />
      <text y="5" class="mono-label" font-size="12" font-weight="700" fill="#FDE68A" letter-spacing="1">☕ JAVA</text>
    </g>

    <!-- Python -->
    <g transform="translate(-195, 0)">
      <rect x="-55" y="-16" width="110" height="32" rx="8" fill="#0C1429" stroke="#38BDF8" stroke-width="1.4" />
      <text y="5" class="mono-label" font-size="12" font-weight="700" fill="#BAE6FD" letter-spacing="1">🐍 PYTHON</text>
    </g>

    <!-- React & Vite -->
    <g transform="translate(-65, 0)">
      <rect x="-60" y="-16" width="120" height="32" rx="8" fill="#0C1429" stroke="#00F0FF" stroke-width="1.4" />
      <text y="5" class="mono-label" font-size="12" font-weight="700" fill="#A5F3FC" letter-spacing="1">⚛️ REACT 18</text>
    </g>

    <!-- Node.js -->
    <g transform="translate(70, 0)">
      <rect x="-60" y="-16" width="120" height="32" rx="8" fill="#0C1429" stroke="#10B981" stroke-width="1.4" />
      <text y="5" class="mono-label" font-size="12" font-weight="700" fill="#A7F3D0" letter-spacing="1">🟢 NODE.JS</text>
    </g>

    <!-- PostgreSQL -->
    <g transform="translate(205, 0)">
      <rect x="-60" y="-16" width="120" height="32" rx="8" fill="#0C1429" stroke="#6366F1" stroke-width="1.4" />
      <text y="5" class="mono-label" font-size="12" font-weight="700" fill="#C7D2FE" letter-spacing="1">🐘 POSTGRES</text>
    </g>

    <!-- Scikit-Learn AI -->
    <g transform="translate(340, 0)">
      <rect x="-60" y="-16" width="120" height="32" rx="8" fill="#0C1429" stroke="#EC4899" stroke-width="1.4" />
      <text y="5" class="mono-label" font-size="12" font-weight="700" fill="#FBCFE8" letter-spacing="1">🧠 SCIKIT AI</text>
    </g>
  </g>

  <!-- Bottom Command Line Strip -->
  <g transform="translate(500, 292)" text-anchor="middle">
    <text class="mono-label" font-size="11.5" fill="#64748B" letter-spacing="1.5">
      <tspan fill="#10B981">❯</tspan> <tspan fill="#38BDF8">const</tspan> <tspan fill="#F8FAFC">dev</tspan> = <tspan fill="#F59E0B">new</tspan> <tspan fill="#A855F7">Engineer</tspan>(<tspan fill="#FDE68A">"High Scale"</tspan>, <tspan fill="#A5F3FC">"Predictive ML"</tspan>, <tspan fill="#34D399">"Enterprise Systems"</tspan>);
    </text>
  </g>
</svg>