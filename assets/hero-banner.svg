<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="100%" stop-color="#0D111A" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#141E2E" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.2" fill="#00F0FF" fill-opacity="0.25" />
    </pattern>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 12px rgba(0,240,255,0.4)); }
        50% { filter: drop-shadow(0 0 24px rgba(168,85,247,0.7)); }
      }
      .glow-text {
        animation: glow 4s infinite ease-in-out;
      }
      .live-dot {
        animation: pulse 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background with border and grid -->
  <rect width="950" height="260" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect width="950" height="260" rx="16" fill="url(#grid)" />

  <!-- Corner Crosshairs / HUD Markers -->
  <path d="M 24 16 L 16 16 L 16 24" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 926 16 L 934 16 L 934 24" fill="none" stroke="#EC4899" stroke-width="2" />
  <path d="M 24 244 L 16 244 L 16 236" fill="none" stroke="#00F0FF" stroke-width="2" />
  <path d="M 926 244 L 934 244 L 934 236" fill="none" stroke="#EC4899" stroke-width="2" />

  <!-- Top Metadata bar -->
  <text x="35" y="42" font-family="'Space Grotesk', 'Fira Code', monospace" font-size="11" fill="#4B6A9B" letter-spacing="2">SYS.VER // 4.2.0</text>
  <text x="180" y="42" font-family="'Space Grotesk', 'Fira Code', monospace" font-size="11" fill="#4B6A9B" letter-spacing="2">CANVAS // 0xPREYANSH</text>

  <!-- Status pill -->
  <g transform="translate(730, 28)">
    <rect width="185" height="22" rx="11" fill="#0E1726" stroke="#1E2E48" stroke-width="1" />
    <circle cx="15" cy="11" r="4" fill="#00F0FF" class="live-dot" />
    <text x="26" y="15" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#00F0FF" letter-spacing="1">SYSTEM OPERATIONAL</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(475, 125)" text-anchor="middle">
    <text font-family="'Space Grotesk', 'Helvetica Neue', sans-serif" font-weight="900" font-size="52" fill="url(#textGrad)" letter-spacing="3" class="glow-text">
      PREYANSH BHAGATWALA
    </text>
  </g>

  <!-- Subtitle: Where Code Meets Design -->
  <g transform="translate(475, 168)" text-anchor="middle">
    <text font-family="'Fira Code', monospace" font-weight="600" font-size="15" fill="#E2E8F0" letter-spacing="4">
      SOFTWARE ENGINEER  ✦  DESIGN TECHNOLOGIST
    </text>
  </g>

  <!-- Interactive Tag Pills at Bottom -->
  <g transform="translate(475, 218)" text-anchor="middle">
    <!-- Tag 1 -->
    <g transform="translate(-240, 0)">
      <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#0C1322" stroke="#00F0FF" stroke-opacity="0.5" stroke-width="1"/>
      <text y="4" font-family="'Fira Code', monospace" font-size="11" fill="#00F0FF" text-anchor="middle">PIXEL ARCHITECTURE</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#0C1322" stroke="#A855F7" stroke-opacity="0.5" stroke-width="1"/>
      <text y="4" font-family="'Fira Code', monospace" font-size="11" fill="#C084FC" text-anchor="middle">DISTRIBUTED SYSTEMS</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(240, 0)">
      <rect x="-85" y="-14" width="170" height="26" rx="13" fill="#0C1322" stroke="#EC4899" stroke-opacity="0.5" stroke-width="1"/>
      <text y="4" font-family="'Fira Code', monospace" font-size="11" fill="#F472B6" text-anchor="middle">MACHINE LEARNING</text>
    </g>
  </g>
</svg>