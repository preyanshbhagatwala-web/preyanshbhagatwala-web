<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080D" />
      <stop offset="60%" stop-color="#0B0E17" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>

    <!-- Platinum & Titanium Metallic Text -->
    <linearGradient id="metalTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Subtle Cyan-Blue Laser Accent -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Precision Architectural Hairline Grid -->
    <pattern id="archGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#141824" stroke-width="0.6" stroke-opacity="0.6" />
    </pattern>

    <!-- Linear Border Gradient -->
    <linearGradient id="frameBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="25%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.5" />
    </linearGradient>

    <style>
      @keyframes laserSweep {
        0% { transform: translateX(-1000px); }
        100% { transform: translateX(1000px); }
      }
      @keyframes subtlePulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      .laser-beam {
        animation: laserSweep 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .status-pulse {
        animation: subtlePulse 2.5s infinite ease-in-out;
      }
      .mono-text {
        font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      }
      .sans-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
  </defs>

  <!-- Canvas Base -->
  <rect width="980" height="260" rx="10" fill="url(#bgGrad)" stroke="url(#frameBorder)" stroke-width="1.2" />
  
  <!-- Architectural Grid Layer -->
  <rect width="980" height="260" rx="10" fill="url(#archGrid)" />

  <!-- Laser Beam Sweep Effect on Top Border -->
  <g clip-path="url(#borderClip)">
    <rect x="0" y="0" width="300" height="1.8" fill="url(#laserGrad)" class="laser-beam" />
  </g>

  <!-- Precision Technical Reticles (Hairline Crosses) -->
  <g stroke="#334155" stroke-width="0.8">
    <!-- Top Left Cross -->
    <line x1="20" y1="16" x2="20" y2="24" />
    <line x1="16" y1="20" x2="24" y2="20" />
    <!-- Top Right Cross -->
    <line x1="960" y1="16" x2="960" y2="24" />
    <line x1="956" y1="20" x2="964" y2="20" />
    <!-- Bottom Left Cross -->
    <line x1="20" y1="236" x2="20" y2="244" />
    <line x1="16" y1="240" x2="24" y2="240" />
    <!-- Bottom Right Cross -->
    <line x1="960" y1="236" x2="960" y2="244" />
    <line x1="956" y1="240" x2="964" y2="240" />
  </g>

  <!-- Header Telemetry Bar -->
  <g transform="translate(36, 30)">
    <circle cx="0" cy="0" r="2.5" fill="#38BDF8" />
    <text x="10" y="3.5" class="mono-text" font-size="10" fill="#38BDF8" font-weight="700" letter-spacing="2">SYS.ID // PREYANSH.ARCH</text>
    <text x="210" y="3.5" class="mono-text" font-size="9.5" fill="#64748B" letter-spacing="1.5">DOMAIN: FULL-STACK SYSTEMS &amp; MACHINE LEARNING</text>
    <text x="635" y="3.5" class="mono-text" font-size="9.5" fill="#64748B" letter-spacing="1.5">LOCATION: IN [UTC+5:30]</text>
    
    <!-- Status Indicator -->
    <g transform="translate(830, 0)">
      <circle cx="0" cy="0" r="3.5" fill="#10B981" class="status-pulse" />
      <text x="9" y="3.5" class="mono-text" font-size="9" fill="#10B981" font-weight="700" letter-spacing="1">AVAILABLE</text>
    </g>
  </g>

  <!-- Horizontal Hairline Divider -->
  <line x1="36" y1="46" x2="944" y2="46" stroke="#1E293B" stroke-width="0.8" />

  <!-- Center Executive Brand Title -->
  <g transform="translate(490, 110)" text-anchor="middle">
    <text class="sans-title" font-weight="800" font-size="44" fill="url(#metalTitle)" letter-spacing="7">
      PREYANSH BHAGATWALA
    </text>
  </g>

  <!-- Executive Role Specification -->
  <g transform="translate(490, 144)" text-anchor="middle">
    <text class="mono-text" font-size="12" font-weight="600" fill="#94A3B8" letter-spacing="3.5">
      <tspan fill="#E2E8F0">SOFTWARE ENGINEER</tspan>
      <tspan fill="#475569">   |   </tspan>
      <tspan fill="#38BDF8">FULL STACK DEVELOPER</tspan>
      <tspan fill="#475569">   |   </tspan>
      <tspan fill="#A78BFA">AI/ML ENTHUSIAST</tspan>
    </text>
  </g>

  <!-- Horizontal Hairline Divider -->
  <line x1="36" y1="172" x2="944" y2="172" stroke="#1E293B" stroke-width="0.8" />

  <!-- Architectural Engineering Pillars (High-Density MNC Data Strip) -->
  <g transform="translate(490, 212)" text-anchor="middle">
    <!-- Pillar 1: Enterprise Backend & Java -->
    <g transform="translate(-295, 0)">
      <rect x="-130" y="-18" width="260" height="34" rx="4" fill="#0C101B" stroke="#1E293B" stroke-width="0.9"/>
      <line x1="-130" y1="-18" x2="-130" y2="16" stroke="#38BDF8" stroke-width="2" />
      <text x="-115" y="-3" class="mono-text" font-size="8.5" fill="#64748B" letter-spacing="1.5" text-anchor="start">01 // ENTERPRISE BACKEND</text>
      <text x="-115" y="11" class="mono-text" font-size="11" fill="#F1F5F9" font-weight="600" text-anchor="start">Java • Node.js • PostgreSQL</text>
    </g>

    <!-- Pillar 2: Modern Web Architecture -->
    <g transform="translate(0, 0)">
      <rect x="-130" y="-18" width="260" height="34" rx="4" fill="#0C101B" stroke="#1E293B" stroke-width="0.9"/>
      <line x1="-130" y1="-18" x2="-130" y2="16" stroke="#818CF8" stroke-width="2" />
      <text x="-115" y="-3" class="mono-text" font-size="8.5" fill="#64748B" letter-spacing="1.5" text-anchor="start">02 // CLIENT ARCHITECTURE</text>
      <text x="-115" y="11" class="mono-text" font-size="11" fill="#F1F5F9" font-weight="600" text-anchor="start">React 18 • TypeScript • Vite</text>
    </g>

    <!-- Pillar 3: Machine Learning & Intelligence -->
    <g transform="translate(295, 0)">
      <rect x="-130" y="-18" width="260" height="34" rx="4" fill="#0C101B" stroke="#1E293B" stroke-width="0.9"/>
      <line x1="-130" y1="-18" x2="-130" y2="16" stroke="#34D399" stroke-width="2" />
      <text x="-115" y="-3" class="mono-text" font-size="8.5" fill="#64748B" letter-spacing="1.5" text-anchor="start">03 // APPLIED INTELLIGENCE</text>
      <text x="-115" y="11" class="mono-text" font-size="11" fill="#F1F5F9" font-weight="600" text-anchor="start">Scikit-Learn • ML Pipelines</text>
    </g>
  </g>

  <!-- Bottom Coordinates & Precision Monospace -->
  <g transform="translate(36, 246)">
    <text class="mono-text" font-size="8.5" fill="#475569" letter-spacing="1">ARCH: DISTRIBUTED &amp; RESILIENT</text>
  </g>
  <g transform="translate(944, 246)" text-anchor="end">
    <text class="mono-text" font-size="8.5" fill="#475569" letter-spacing="1">HASH: 0x8F9A // MNC_PROD_SPEC</text>
  </g>
</svg>