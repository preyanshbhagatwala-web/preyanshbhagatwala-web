<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 340" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711" />
      <stop offset="50%" stop-color="#0A0E21" />
      <stop offset="100%" stop-color="#04060E" />
    </linearGradient>

    <!-- Radial Glowing Orbs -->
    <radialGradient id="cyanOrb" cx="12%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pinkOrb" cx="88%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#FF007A" stop-opacity="0" />
    </radialGradient>

    <!-- Dynamic Animated Name Gradient -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF">
        <animate attributeName="stop-color" values="#00F0FF;#A855F7;#FF007A;#00F0FF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#FF007A;#00F0FF;#A855F7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF007A">
        <animate attributeName="stop-color" values="#FF007A;#00F0FF;#A855F7;#FF007A" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Flowing Wave Gradients -->
    <linearGradient id="waveCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="wavePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.5" />
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#8B5CF6" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#FF007A" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Pattern Grid -->
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#161F36" stroke-width="0.7" stroke-opacity="0.45" />
      <circle cx="28" cy="28" r="1.1" fill="#8B5CF6" fill-opacity="0.35" />
    </pattern>

    <!-- Embedded Keyframe Animations -->
    <style>
      @keyframes glowPulse {
        0%, 100% { filter: drop-shadow(0 0 16px rgba(0,240,255,0.45)) drop-shadow(0 0 35px rgba(168,85,247,0.25)); }
        50% { filter: drop-shadow(0 0 28px rgba(255,0,122,0.65)) drop-shadow(0 0 50px rgba(0,240,255,0.45)); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1200; }
      }
      @keyframes pulseBeacon {
        0% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.7); opacity: 0.35; }
        100% { transform: scale(2.3); opacity: 0; }
      }
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: 5.5px;
        animation: glowPulse 6s infinite ease-in-out;
      }
      .wave-one {
        stroke-dasharray: 14, 10;
        animation: dashMove 36s linear infinite;
      }
      .wave-two {
        stroke-dasharray: 18, 12;
        animation: dashMove 48s linear reverse infinite;
      }
      .beacon-ring {
        animation: pulseBeacon 2.2s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
        transform-origin: 16px 16px;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="980" height="340" rx="18" fill="url(#canvasBg)" stroke="url(#borderGrad)" stroke-width="1.6" />
  
  <!-- Glowing Atmospheric Light Cones -->
  <rect width="980" height="340" rx="18" fill="url(#cyanOrb)" />
  <rect width="980" height="340" rx="18" fill="url(#purpleOrb)" />
  <rect width="980" height="340" rx="18" fill="url(#pinkOrb)" />

  <!-- Digital Circuit / Coordinate Grid -->
  <rect width="980" height="340" rx="18" fill="url(#dotGrid)" />

  <!-- Generative Curvilinear Waves (Creative Code Visuals) -->
  <g opacity="0.8">
    <path d="M -40 250 C 140 160, 260 320, 470 230 C 680 140, 800 290, 1020 200" 
          fill="none" stroke="url(#waveCyan)" stroke-width="2.6" class="wave-one" />
    <path d="M -40 280 C 170 210, 310 350, 520 260 C 730 170, 850 310, 1020 230" 
          fill="none" stroke="url(#wavePink)" stroke-width="2" class="wave-two" />
    <path d="M -40 220 C 200 120, 360 300, 570 190 C 760 100, 870 250, 1020 160" 
          fill="none" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="5, 6" />
  </g>

  <!-- Precision Corner Reticles -->
  <path d="M 28 18 L 18 18 L 18 28" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 952 18 L 962 18 L 962 28" fill="none" stroke="#FF007A" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 28 322 L 18 322 L 18 312" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 952 322 L 962 322 L 962 312" fill="none" stroke="#FF007A" stroke-width="2.5" stroke-linecap="round" />

  <!-- Top Telemetry Row -->
  <g transform="translate(32, 38)">
    <circle cx="0" cy="0" r="3" fill="#00F0FF" />
    <text x="12" y="4" font-family="'Cascadia Code', 'Fira Code', monospace" font-size="11" fill="#38BDF8" font-weight="700" letter-spacing="2">DEV.ENGINE // 0xPREYANSH</text>
    <text x="235" y="4" font-family="'Cascadia Code', 'Fira Code', monospace" font-size="10.5" fill="#64748B" letter-spacing="1.5">LOCATION: IN [UTC+5:30]</text>
    <text x="465" y="4" font-family="'Cascadia Code', 'Fira Code', monospace" font-size="10.5" fill="#64748B" letter-spacing="1.5">CORE: FULL-STACK &amp; APPLIED AI</text>
  </g>

  <!-- Live Pulse Status Beacon -->
  <g transform="translate(735, 25)">
    <rect width="215" height="28" rx="14" fill="#081022" stroke="#10B981" stroke-opacity="0.6" stroke-width="1.2" />
    <circle cx="16" cy="14" r="5" fill="#10B981" class="beacon-ring" />
    <circle cx="16" cy="14" r="4" fill="#10B981" />
    <text x="32" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#34D399" letter-spacing="1.2">SYSTEM OPERATIONAL</text>
  </g>

  <!-- Name Hero (Centerpiece) -->
  <g transform="translate(490, 140)" text-anchor="middle">
    <text font-size="47" fill="url(#nameGradient)" class="brand-title">
      PREYANSH BHAGATWALA
    </text>
  </g>

  <!-- Role Subtitle Ribbon -->
  <g transform="translate(490, 185)" text-anchor="middle">
    <rect x="-360" y="-16" width="720" height="32" rx="16" fill="#080C1F" fill-opacity="0.85" stroke="#1E293B" stroke-width="1" />
    <text y="5.5" font-family="'Cascadia Code', 'Fira Code', monospace" font-weight="600" font-size="13.5" letter-spacing="2.8">
      <tspan fill="#38BDF8">SOFTWARE ENGINEER</tspan>
      <tspan fill="#64748B">  ✦  </tspan>
      <tspan fill="#C084FC">FULL STACK DEVELOPER</tspan>
      <tspan fill="#64748B">  ✦  </tspan>
      <tspan fill="#F43F5E">AI/ML ENTHUSIAST</tspan>
    </text>
  </g>

  <!-- Symmetrical 3 Pillars (Java Backend, Modern Web Architecture, Applied ML) -->
  <g transform="translate(490, 250)" text-anchor="middle">
    <!-- Pillar 1: Java & Distributed Backend -->
    <g transform="translate(-290, 0)">
      <rect x="-125" y="-17" width="250" height="34" rx="17" fill="#090E20" stroke="#F59E0B" stroke-opacity="0.8" stroke-width="1.3"/>
      <circle cx="-102" cy="0" r="4" fill="#F59E0B" />
      <text x="-88" y="5" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#FDE68A" letter-spacing="1">
        JAVA &amp; DISTRIBUTED BACKEND
      </text>
    </g>

    <!-- Pillar 2: React & Full Stack Systems -->
    <g transform="translate(0, 0)">
      <rect x="-130" y="-17" width="260" height="34" rx="17" fill="#090E20" stroke="#00F0FF" stroke-opacity="0.8" stroke-width="1.3"/>
      <circle cx="-107" cy="0" r="4" fill="#00F0FF" />
      <text x="-93" y="5" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#BAE6FD" letter-spacing="1">
        REACT &amp; SYSTEM ARCHITECTURE
      </text>
    </g>

    <!-- Pillar 3: Machine Learning & Intelligence -->
    <g transform="translate(290, 0)">
      <rect x="-125" y="-17" width="250" height="34" rx="17" fill="#090E20" stroke="#EC4899" stroke-opacity="0.8" stroke-width="1.3"/>
      <circle cx="-102" cy="0" r="4" fill="#EC4899" />
      <text x="-88" y="5" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#FBCFE8" letter-spacing="1">
        APPLIED AI &amp; ML PIPELINES
      </text>
    </g>
  </g>

  <!-- Bottom Interactive Code Art Strip -->
  <g transform="translate(490, 308)" text-anchor="middle">
    <text font-family="'Cascadia Code', 'Fira Code', monospace" font-size="11" fill="#64748B" letter-spacing="1.5">
      <tspan fill="#10B981">❯</tspan> <tspan fill="#60A5FA">engineer</tspan>.<tspan fill="#F472B6">build</tspan>(<tspan fill="#FDE68A">"High-Scale Systems"</tspan>, <tspan fill="#A78BFA">"Predictive AI"</tspan>, <tspan fill="#38BDF8">"Crafted Interfaces"</tspan>)
    </text>
  </g>
</svg>