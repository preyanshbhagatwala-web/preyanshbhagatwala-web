<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;
      }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="920" height="180" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />

  <!-- Top Metadata Bar -->
  <g transform="translate(32, 28)">
    <circle cx="4" cy="4" r="3.5" fill="#3fb950" />
    <text x="16" y="8" class="mono" font-size="11" fill="#3fb950" font-weight="600">OPEN TO OPPORTUNITIES</text>
    <text x="210" y="8" class="mono" font-size="11" fill="#8b949e">LOCATION: INDIA</text>
    <text x="350" y="8" class="mono" font-size="11" fill="#8b949e">DOMAIN: FULL STACK &amp; AI/ML</text>
  </g>

  <!-- Subtle Divider -->
  <line x1="32" y1="44" x2="888" y2="44" stroke="#21262d" stroke-width="1" />

  <!-- Main Identity -->
  <g transform="translate(32, 92)">
    <text class="sans" font-size="34" font-weight="700" fill="#f0f6fc" letter-spacing="1">
      Preyansh Bhagatwala
    </text>
    <text y="28" class="sans" font-size="14.5" font-weight="500" fill="#8b949e">
      Software Engineer  •  Full Stack Developer  •  AI/ML Enthusiast
    </text>
  </g>

  <!-- Core Stack Badges Strip at Bottom -->
  <g transform="translate(32, 146)">
    <!-- Java -->
    <g transform="translate(0, 0)">
      <rect width="64" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="32" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#c9d1d9">Java</text>
    </g>
    <!-- Python -->
    <g transform="translate(72, 0)">
      <rect width="72" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="36" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#c9d1d9">Python</text>
    </g>
    <!-- React -->
    <g transform="translate(152, 0)">
      <rect width="68" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="34" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#c9d1d9">React</text>
    </g>
    <!-- Node.js -->
    <g transform="translate(228, 0)">
      <rect width="78" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="39" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#c9d1d9">Node.js</text>
    </g>
    <!-- PostgreSQL -->
    <g transform="translate(314, 0)">
      <rect width="98" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="49" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#c9d1d9">PostgreSQL</text>
    </g>
    <!-- Machine Learning -->
    <g transform="translate(420, 0)">
      <rect width="138" height="22" rx="4" fill="#21262d" stroke="#30363d" stroke-width="1" />
      <text x="69" y="15" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#c9d1d9">Machine Learning</text>
    </g>
  </g>
</svg>
