<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="100%">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080F" />
      <stop offset="100%" stop-color="#0D121F" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#151E30" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.2" fill="#00F0FF" fill-opacity="0.35" />
    </pattern>
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes subtleGlow {
        0%, 100% { filter: drop-shadow(0 0 14px rgba(0,240,255,0.35)); }
        50% { filter: drop-shadow(0 0 26px rgba(129,140,248,0.65)); }
      }
      .name-title {
        animation: subtleGlow 4s infinite ease-in-out;
      }
      .pulse-dot {
        animation: pulse 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <rect width="960" height="270" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect width="960" height="270" rx="16" fill="url(#grid)" />

  <!-- Corner Brackets -->
  <path d="M 26 16 L 16 16 L 16 26" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 934 16 L 944 16 L 944 26" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 26 254 L 16 254 L 16 244" fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 934 254 L 944 254 L 944 244" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round" />

  <!-- Top Metadata Bar -->
  <text x="34" y="42" font-family="'Fira Code', 'Space Grotesk', monospace" font-size="11" fill="#475569" font-weight="600" letter-spacing="2">PREYANSH.DEV // 2026</text>
  <text x="215" y="42" font-family="'Fira Code', 'Space Grotesk', monospace" font-size="11" fill="#475569" font-weight="600" letter-spacing="2">CORE_SYSTEMS</text>

  <!-- Live Status Badge -->
  <g transform="translate(735, 27)">
    <rect width="190" height="24" rx="12" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
    <circle cx="14" cy="12" r="4.5" fill="#10B981" class="pulse-dot" />
    <text x="26" y="16" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5" fill="#10B981" letter-spacing="1">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Hero Name -->
  <g transform="translate(480, 126)" text-anchor="middle">
    <text font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="50" fill="url(#textGrad)" letter-spacing="3" class="name-title">
      PREYANSH BHAGATWALA
    </text>
  </g>

  <!-- Subtitle with exact user roles -->
  <g transform="translate(480, 168)" text-anchor="middle">
    <text font-family="'Fira Code', monospace" font-weight="600" font-size="14.5" fill="#F1F5F9" letter-spacing="3.5">
      SOFTWARE ENGINEER  ✦  FULL STACK DEVELOPER  ✦  AI/ML ENTHUSIAST
    </text>
  </g>

  <!-- Interactive Tag Pills at Bottom -->
  <g transform="translate(480, 222)" text-anchor="middle">
    <!-- Tag 1: Full Stack -->
    <g transform="translate(-255, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#090D1A" stroke="#00F0FF" stroke-opacity="0.7" stroke-width="1.2"/>
      <text y="4.5" font-family="'Fira Code', monospace" font-weight="600" font-size="11" fill="#00F0FF" letter-spacing="1" text-anchor="middle">FULL STACK SYSTEMS</text>
    </g>
    <!-- Tag 2: Software Engineering -->
    <g transform="translate(0, 0)">
      <rect x="-105" y="-14" width="210" height="28" rx="14" fill="#090D1A" stroke="#818CF8" stroke-opacity="0.7" stroke-width="1.2"/>
      <text y="4.5" font-family="'Fira Code', monospace" font-weight="600" font-size="11" fill="#A5B4FC" letter-spacing="1" text-anchor="middle">SOFTWARE ENGINEERING</text>
    </g>
    <!-- Tag 3: AI/ML -->
    <g transform="translate(255, 0)">
      <rect x="-95" y="-14" width="190" height="28" rx="14" fill="#090D1A" stroke="#F43F5E" stroke-opacity="0.7" stroke-width="1.2"/>
      <text y="4.5" font-family="'Fira Code', monospace" font-weight="600" font-size="11" fill="#FDA4AF" letter-spacing="1" text-anchor="middle">AI &amp; MACHINE LEARNING</text>
    </g>
  </g>
</svg>
